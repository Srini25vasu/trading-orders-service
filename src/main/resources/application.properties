spring.application.name=trading-orders-service
server.port=7080
#Postgres Configuration
spring.datasource.url=jdbc:postgresql://localhost:49153/blogdb?currentSchema=portfolio
spring.datasource.username=jusmoredb
spring.datasource.password=jusmoredb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Enable virtual threads
#Once set, Spring can run web requests, @Async tasks, and scheduled operations on virtual threads by default.
spring.threads.virtual.enabled=true

# JPA/Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# actuator endoints
#/actuator/env, /actuator/health
#GET http://localhost:8080/actuator/threaddump
management.endpoints.web.exposure.include=threaddump,health,info,env
logging.level.org.springframework.boot.web=DEBUG
management.endpoint.health.show-details=always
management.endpoint.threaddump.enabled=true


# OpenID Connect / OAuth2 Configuration
# Replace with your OIDC provider's issuer URI
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-oidc-provider.com/realms/your-realm
# Alternative: Use JWK Set URI directly
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://your-oidc-provider.com/realms/your-realm/protocol/openid-connect/certs

# Optional: Configure JWT claims for authorities
# spring.security.oauth2.resourceserver.jwt.audiences=trading-orders-api
